<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">

  <!-- CHIP BODY (vertical DIP, pins 1/40 at top, 20/21 at bottom) -->
  <rect x="250" y="100" width="300" height="380" fill="#222" stroke="#000" stroke-width="2"/>

  <!-- ORIENTATION NOTCH -->
  <path d="M380 100 L370 80 L360 100 Z" fill="#444"/>

  <!-- CHIP LABEL -->
  <text x="400" y="140" fill="#ffffff" font-size="20" text-anchor="middle">POKEY CO12294</text>

  <!-- LEFT SIDE PINS (1–20, top to bottom) -->
  <!-- y = 100 + (n-1)*20 -->

  <!-- 1 VSS -->
  <line x1="250" y1="100" x2="220" y2="100" stroke="#888" stroke-width="2"/>
  <text x="210" y="105" font-size="12" text-anchor="end" fill="#000">1 VSS</text>

  <!-- 2 D3 -->
  <line x1="250" y1="120" x2="220" y2="120" stroke="#888" stroke-width="2"/>
  <text x="210" y="125" font-size="12" text-anchor="end" fill="#000">2 D3</text>

  <!-- 3 D4 -->
  <line x1="250" y1="140" x2="220" y2="140" stroke="#888" stroke-width="2"/>
  <text x="210" y="145" font-size="12" text-anchor="end" fill="#000">3 D4</text>

  <!-- 4 D5 -->
  <line x1="250" y1="160" x2="220" y2="160" stroke="#888" stroke-width="2"/>
  <text x="210" y="165" font-size="12" text-anchor="end" fill="#000">4 D5</text>

  <!-- 5 D6 -->
  <line x1="250" y1="180" x2="220" y2="180" stroke="#888" stroke-width="2"/>
  <text x="210" y="185" font-size="12" text-anchor="end" fill="#000">5 D6</text>

  <!-- 6 D7 -->
  <line x1="250" y1="200" x2="220" y2="200" stroke="#888" stroke-width="2"/>
  <text x="210" y="205" font-size="12" text-anchor="end" fill="#000">6 D7</text>

  <!-- 7 Φ2 -->
  <line x1="250" y1="220" x2="220" y2="220" stroke="#888" stroke-width="2"/>
  <text x="210" y="225" font-size="12" text-anchor="end" fill="#000">7 Φ2</text>

  <!-- 8 P6 -->
  <line x1="250" y1="240" x2="220" y2="240" stroke="#888" stroke-width="2"/>
  <text x="210" y="245" font-size="12" text-anchor="end" fill="#000">8 P6</text>

  <!-- 9 P7 -->
  <line x1="250" y1="260" x2="220" y2="260" stroke="#888" stroke-width="2"/>
  <text x="210" y="265" font-size="12" text-anchor="end" fill="#000">9 P7</text>

  <!-- 10 P4 -->
  <line x1="250" y1="280" x2="220" y2="280" stroke="#888" stroke-width="2"/>
  <text x="210" y="285" font-size="12" text-anchor="end" fill="#000">10 P4</text>

  <!-- 11 P5 -->
  <line x1="250" y1="300" x2="220" y2="300" stroke="#888" stroke-width="2"/>
  <text x="210" y="305" font-size="12" text-anchor="end" fill="#000">11 P5</text>

  <!-- 12 P2 -->
  <line x1="250" y1="320" x2="220" y2="320" stroke="#888" stroke-width="2"/>
  <text x="210" y="325" font-size="12" text-anchor="end" fill="#000">12 P2</text>

  <!-- 13 P3 -->
  <line x1="250" y1="340" x2="220" y2="340" stroke="#888" stroke-width="2"/>
  <text x="210" y="345" font-size="12" text-anchor="end" fill="#000">13 P3</text>

  <!-- 14 P0 -->
  <line x1="250" y1="360" x2="220" y2="360" stroke="#888" stroke-width="2"/>
  <text x="210" y="365" font-size="12" text-anchor="end" fill="#000">14 P0</text>

  <!-- 15 P1 -->
  <line x1="250" y1="380" x2="220" y2="380" stroke="#888" stroke-width="2"/>
  <text x="210" y="385" font-size="12" text-anchor="end" fill="#000">15 P1</text>

  <!-- 16 KR2 -->
  <line x1="250" y1="400" x2="220" y2="400" stroke="#888" stroke-width="2"/>
  <text x="210" y="405" font-size="12" text-anchor="end" fill="#000">16 KR2</text>

  <!-- 17 VCC -->
  <line x1="250" y1="420" x2="220" y2="420" stroke="#888" stroke-width="2"/>
  <text x="210" y="425" font-size="12" text-anchor="end" fill="#000">17 VCC</text>

  <!-- 18 K5 -->
  <line x1="250" y1="440" x2="220" y2="440" stroke="#888" stroke-width="2"/>
  <text x="210" y="445" font-size="12" text-anchor="end" fill="#000">18 K5</text>

  <!-- 19 K4 -->
  <line x1="250" y1="460" x2="220" y2="460" stroke="#888" stroke-width="2"/>
  <text x="210" y="465" font-size="12" text-anchor="end" fill="#000">19 K4</text>

  <!-- 20 K3 -->
  <line x1="250" y1="480" x2="220" y2="480" stroke="#888" stroke-width="2"/>
  <text x="210" y="485" font-size="12" text-anchor="end" fill="#000">20 K3</text>

  <!-- RIGHT SIDE PINS (21–40, bottom to top) -->
  <!-- y for pin k = 100 + (40 - k)*20 -->

  <!-- 21 K2 (bottom) -->
  <line x1="550" y1="480" x2="580" y2="480" stroke="#888" stroke-width="2"/>
  <text x="590" y="485" font-size="12" text-anchor="start" fill="#000">21 K2</text>

  <!-- 22 K1 -->
  <line x1="550" y1="460" x2="580" y2="460" stroke="#888" stroke-width="2"/>
  <text x="590" y="465" font-size="12" text-anchor="start" fill="#000">22 K1</text>

  <!-- 23 K0 -->
  <line x1="550" y1="440" x2="580" y2="440" stroke="#888" stroke-width="2"/>
  <text x="590" y="445" font-size="12" text-anchor="start" fill="#000">23 K0</text>

  <!-- 24 SID -->
  <line x1="550" y1="420" x2="580" y2="420" stroke="#888" stroke-width="2"/>
  <text x="590" y="425" font-size="12" text-anchor="start" fill="#000">24 SID</text>

  <!-- 25 KR1 -->
  <line x1="550" y1="400" x2="580" y2="400" stroke="#888" stroke-width="2"/>
  <text x="590" y="405" font-size="12" text-anchor="start" fill="#000">25 KR1</text>

  <!-- 26 BCLK -->
  <line x1="550" y1="380" x2="580" y2="380" stroke="#888" stroke-width="2"/>
  <text x="590" y="385" font-size="12" text-anchor="start" fill="#000">26 BCLK</text>

  <!-- 27 ACLK -->
  <line x1="550" y1="360" x2="580" y2="360" stroke="#888" stroke-width="2"/>
  <text x="590" y="365" font-size="12" text-anchor="start" fill="#000">27 ACLK</text>

  <!-- 28 SOD -->
  <line x1="550" y1="340" x2="580" y2="340" stroke="#888" stroke-width="2"/>
  <text x="590" y="345" font-size="12" text-anchor="start" fill="#000">28 SOD</text>

  <!-- 29 IRQ -->
  <line x1="550" y1="320" x2="580" y2="320" stroke="#888" stroke-width="2"/>
  <text x="590" y="325" font-size="12" text-anchor="start" fill="#000">29 IRQ</text>

  <!-- 30 CS0 -->
  <line x1="550" y1="300" x2="580" y2="300" stroke="#888" stroke-width="2"/>
  <text x="590" y="305" font-size="12" text-anchor="start" fill="#000">30 CS0</text>

  <!-- 31 CS1 -->
  <line x1="550" y1="280" x2="580" y2="280" stroke="#888" stroke-width="2"/>
  <text x="590" y="285" font-size="12" text-anchor="start" fill="#000">31 CS1</text>

  <!-- 32 R/W -->
  <line x1="550" y1="260" x2="580" y2="260" stroke="#888" stroke-width="2"/>
  <text x="590" y="265" font-size="12" text-anchor="start" fill="#000">32 R/W</text>

  <!-- 33 A3 -->
  <line x1="550" y1="240" x2="580" y2="240" stroke="#888" stroke-width="2"/>
  <text x="590" y="245" font-size="12" text-anchor="start" fill="#000">33 A3</text>

  <!-- 34 A2 -->
  <line x1="550" y1="220" x2="580" y2="220" stroke="#888" stroke-width="2"/>
  <text x="590" y="225" font-size="12" text-anchor="start" fill="#000">34 A2</text>

  <!-- 35 A1 -->
  <line x1="550" y1="200" x2="580" y2="200" stroke="#888" stroke-width="2"/>
  <text x="590" y="205" font-size="12" text-anchor="start" fill="#000">35 A1</text>

  <!-- 36 A0 -->
  <line x1="550" y1="180" x2="580" y2="180" stroke="#888" stroke-width="2"/>
  <text x="590" y="185" font-size="12" text-anchor="start" fill="#000">36 A0</text>

  <!-- 37 AUD -->
  <line x1="550" y1="160" x2="580" y2="160" stroke="#888" stroke-width="2"/>
  <text x="590" y="165" font-size="12" text-anchor="start" fill="#000">37 AUD</text>

  <!-- 38 D0 -->
  <line x1="550" y1="140" x2="580" y2="140" stroke="#888" stroke-width="2"/>
  <text x="590" y="145" font-size="12" text-anchor="start" fill="#000">38 D0</text>

  <!-- 39 D1 -->
  <line x1="550" y1="120" x2="580" y2="120" stroke="#888" stroke-width="2"/>
  <text x="590" y="125" font-size="12" text-anchor="start" fill="#000">39 D1</text>

  <!-- 40 D2 (top) -->
  <line x1="550" y1="100" x2="580" y2="100" stroke="#888" stroke-width="2"/>
  <text x="590" y="105" font-size="12" text-anchor="start" fill="#000">40 D2</text>

</svg>
