  <line x1="650" y1="268" x2="680" y2="268" stroke="#000" stroke-width="2"/>
  <text x="690" y="273" font-size="14" text-anchor="start">25 P4</text>

  <line x1="650" y1="290" x2="680" y2="290" stroke="#000" stroke-width="2"/>
  <text x="690" y="295" font-size="14" text-anchor="start">26 P5</text>

  <line x1="650" y1="312" x2="680" y2="312" stroke="#000" stroke-width="2"/>
  <text x="690" y="317" font-size="14" text-anchor="start">27 P6</text>

  <line x1="650" y1="334" x2="680" y2="334" stroke="#000" stroke-width="2"/>
  <text x="690" y="339" font-size="14" text-anchor="start">28 P7</text>

  <line x1="650" y1="356" x2="680" y2="356" stroke="#000" stroke-width="2"/>
  <text x="690" y="361" font-size="14" text-anchor="start">29 KR1</text>

  <line x1="650" y1="378" x2="680" y2="378" stroke="#000" stroke-width="2"/>
  <text x="690" y="383" font-size="14" text-anchor="start">30 KR2</text>

  <line x1="650" y1="400" x2="680" y2="400" stroke="#000" stroke-width="2"/>
  <text x="690" y="405" font-size="14" text-anchor="start">31 K0</text>

  <line x1="650" y1="422" x2="680" y2="422" stroke="#000" stroke-width="2"/>
  <text x="690" y="427" font-size="14" text-anchor="start">32 K1</text>

  <line x1="650" y1="444" x2="680" y2="444" stroke="#000" stroke-width="2"/>
  <text x="690" y="449" font-size="14" text-anchor="start">33 K2</text>

  <line x1="650" y1="466" x2="680" y2="466" stroke="#000" stroke-width="2"/>
