  <line x1="250" y1="598" x2="220" y2="598" stroke="#000" stroke-width="2"/>
  <text x="210" y="603" font-size="14" text-anchor="end">20 VSS</text>


  <!-- RIGHT SIDE PINS (21–40) -->
  <!-- Same spacing: y = 180 + (n-21)*22 -->

  <line x1="650" y1="180" x2="680" y2="180" stroke="#000" stroke-width="2"/>
  <text x="690" y="185" font-size="14" text-anchor="start">21 P0</text>

  <line x1="650" y1="202" x2="680" y2="202" stroke="#000" stroke-width="2"/>
