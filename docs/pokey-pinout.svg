  <line x1="250" y1="444" x2="220" y2="444" stroke="#000" stroke-width="2"/>
  <text x="210" y="449" font-size="14" text-anchor="end">13 A12</text>

  <line x1="250" y1="466" x2="220" y2="466" stroke="#000" stroke-width="2"/>
  <text x="210" y="471" font-size="14" text-anchor="end">14 A13</text>

  <line x1="250" y1="488" x2="220" y2="488" stroke="#000" stroke-width="2"/>
  <text x="210" y="493" font-size="14" text-anchor="end">15 A14</text>

  <line x1="250" y1="510" x2="220" y2="510" stroke="#000" stroke-width="2"/>
  <text x="210" y="515" font-size="14" text-anchor="end">16 A15</text>

  <line x1="250" y1="532" x2="220" y2="532" stroke="#000" stroke-width="2"/>
  <text x="210" y="537" font-size="14" text-anchor="end">17 R/W</text>

  <line x1="250" y1="554" x2="220" y2="554" stroke="#000" stroke-width="2"/>
  <text x="210" y="559" font-size="14" text-anchor="end">18 CS0</text>

  <line x1="250" y1="576" x2="220" y2="576" stroke="#000" stroke-width="2"/>
