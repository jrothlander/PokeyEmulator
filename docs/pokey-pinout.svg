  <line x1="650" y1="532" x2="680" y2="532" stroke="#000" stroke-width="2"/>
  <text x="690" y="537" font-size="14" text-anchor="start">37 SID</text>

  <line x1="650" y1="554" x2="680" y2="554" stroke="#000" stroke-width="2"/>
  <text x="690" y="559" font-size="14" text-anchor="start">38 SOD</text>

  <line x1="650" y1="576" x2="680" y2="576" stroke="#000" stroke-width="2"/>
  <text x="690" y="581" font-size="14" text-anchor="start">39 BCLK</text>

  <line x1="650" y1="598" x2="680" y2="598" stroke="#000" stroke-width="2"/>
  <text x="690" y="603" font-size="14" text-anchor="start">40 AUD</text>

</svg>
