<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700">

  <!-- CHIP BODY (tall enough for 40 pins) -->
  <rect x="250" y="100" width="400" height="500" fill="#222" stroke="#000" stroke-width="2"/>
  <text x="450" y="140" fill="#fff" font-size="22" text-anchor="middle">POKEY C012294</text>

  <!-- LEFT SIDE PINS (1–20) -->
  <!-- 20 pins spaced 22px apart starting at y=180 -->
  <!-- y = 180 + (n-1)*22 -->

  <!-- Generate pins 1–20 -->
  <!-- A0..A15, R/W, CS0, CS1, VSS -->

  <!-- Loop manually written for clarity -->

  <line x1="250" y1="180" x2="220" y2="180" stroke="#000" stroke-width="2"/>
  <text x="210" y="185" font-size="14" text-anchor="end">1 A0</text>

  <line x1="250" y1="202" x2="220" y2="202" stroke="#000" stroke-width="2"/>
  <text x="210" y="207" font-size="14" text-anchor="end">2 A1</text>

  <line x1="250" y1="224" x2="220" y2="224" stroke="#000" stroke-width="2"/>
  <text x="210" y="229" font-size="14" text-anchor="end">3 A2</text>

  <line x1="250" y1="246" x2="220" y2="246" stroke="#000" stroke-width="2"/>
  <text x="210" y="251" font-size="14" text-anchor="end">4 A3</text>

  <line x1="250" y1="268" x2="220" y2="268" stroke="#000" stroke-width="2"/>
  <text x="210" y="273" font-size="14" text-anchor="end">5 A4</text>

  <line x1="250" y1="290" x2="220" y2="290" stroke="#000" stroke-width="2"/>
  <text x="210" y="295" font-size="14" text-anchor="end">6 A5</text>

  <line x1="250" y1="312" x2="220" y2="312" stroke="#000" stroke-width="2"/>
  <text x="210" y="317" font-size="14" text-anchor="end">7 A6</text>

  <line x1="250" y1="334" x2="220" y2="334" stroke="#000" stroke-width="2"/>
  <text x="210" y="339" font-size="14" text-anchor="end">8 A7</text>

  <line x1="250" y1="356" x2="220" y2="356" stroke="#000" stroke-width="2"/>
  <text x="210" y="361" font-size="14" text-anchor="end">9 A8</text>

  <line x1="250" y1="378" x2="220" y2="378" stroke="#000" stroke-width="2"/>
  <text x="210" y="383" font-size="14" text-anchor="end">10 A9</text>

  <line x1="250" y1="400" x2="220" y2="400" stroke="#000" stroke-width="2"/>
  <text x="210" y="405" font-size="14" text-anchor="end">11 A10</text>

  <line x1="250" y1="422" x2="220" y2="422" stroke="#000" stroke-width="2"/>
